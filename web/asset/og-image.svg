<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F8F4EE"/>
  
  <!-- Decorative pattern -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="200" fill="#D79A9A"/>
    <circle cx="1100" cy="530" r="250" fill="#C7A65B"/>
  </g>
  
  <!-- Main content -->
  <g transform="translate(600, 315)">
    <!-- Logo text -->
    <text text-anchor="middle" y="-80" font-family="'Noto Serif TC', serif" font-size="72" fill="#7A6556" letter-spacing="0.1em">紬</text>
    <text text-anchor="middle" y="-20" font-family="'Cormorant Garamond', serif" font-size="36" fill="#7A6556" letter-spacing="0.15em" font-style="italic">TSUMUGI</text>
    
    <!-- Divider line -->
    <line x1="-100" y1="20" x2="100" y2="20" stroke="#C7A65B" stroke-width="1"/>
    
    <!-- Tagline -->
    <text text-anchor="middle" y="70" font-family="'Noto Serif TC', serif" font-size="28" fill="#7A6556" letter-spacing="0.2em">把祝福，編織成日常</text>
    
    <!-- Subtitle -->
    <text text-anchor="middle" y="120" font-family="'Inter', sans-serif" font-size="16" fill="#A69E96" letter-spacing="0.1em">日本水引生活品牌</text>
  </g>
  
  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="#7A6556"/>
</svg>
