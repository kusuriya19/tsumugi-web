<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="紬 TSUMUGI — 會員中心。加入會員，掌握新品、季節系列與活動資訊。">
  <meta property="og:title" content="會員中心｜紬 TSUMUGI">
  <meta property="og:description" content="加入會員，掌握新品、季節系列與活動資訊。">
  <meta property="og:image" content="asset/og-image.svg">
  <meta property="og:type" content="website">
  <title>會員中心｜紬 TSUMUGI</title>
  <link rel="icon" type="image/svg+xml" href="asset/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+TC:wght@300;0,400;0,500;0,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .member-hero {
      padding: calc(var(--header-height) + var(--space-5xl)) 0 var(--space-5xl);
      background-color: var(--color-cream);
      text-align: center;
    }

    .member-hero-content {
      max-width: 640px;
      margin: 0 auto;
    }

    .member-hero-title {
      font-family: var(--font-serif-cn);
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.08em;
      color: var(--color-brown);
      margin-bottom: var(--space-md);
    }

    .member-hero-subtitle {
      font-family: var(--font-serif-en);
      font-size: 1.125rem;
      font-weight: 400;
      font-style: italic;
      color: var(--color-gold);
      letter-spacing: 0.12em;
      margin-bottom: var(--space-lg);
    }

    .member-hero-desc {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--color-text-light);
    }

    .member-auth {
      padding: var(--space-5xl) 0;
      background-color: var(--color-white);
    }

    .auth-container {
      max-width: 720px;
      margin: 0 auto;
    }

    .auth-tabs {
      display: flex;
      justify-content: center;
      gap: var(--space-xl);
      margin-bottom: var(--space-3xl);
    }

    .auth-tabs .tab-btn {
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      padding: var(--space-sm) var(--space-md);
      position: relative;
      transition: color var(--transition-fast);
      cursor: pointer;
      background: none;
      border: none;
    }

    .auth-tabs .tab-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background-color: var(--color-gold);
      transition: width var(--transition-base);
    }

    .auth-tabs .tab-btn.active {
      color: var(--color-brown);
    }

    .auth-tabs .tab-btn.active::after {
      width: 100%;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: var(--space-lg);
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--color-text);
      margin-bottom: var(--space-sm);
    }

    .form-group .required {
      color: var(--color-gold);
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--color-gray);
      border-radius: var(--radius-md);
      background-color: var(--color-white);
      font-size: 0.9375rem;
      color: var(--color-text);
      outline: none;
      transition: border-color var(--transition-fast);
    }

    .form-group input:focus {
      border-color: var(--color-gold);
    }

    .form-group input::placeholder {
      color: var(--color-text-muted);
    }

    .form-error {
      display: none;
      font-size: 0.75rem;
      color: #e74c3c;
      margin-top: var(--space-xs);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
    }

    .form-checkbox {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      cursor: pointer;
    }

    .form-checkbox input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color-brown);
      cursor: pointer;
    }

    .form-checkbox span {
      font-size: 0.8125rem;
      color: var(--color-text-light);
    }

    .form-link {
      font-size: 0.8125rem;
      color: var(--color-gold);
      text-decoration: none;
      transition: color var(--transition-fast);
      cursor: pointer;
    }

    .form-link:hover {
      color: var(--color-gold-dark);
    }

    .auth-form .btn-primary {
      width: 100%;
      padding: 14px 32px;
    }

    .auth-form .form-terms {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .auth-form .form-terms input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--color-brown);
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .auth-form .form-terms span {
      font-size: 0.8125rem;
      color: var(--color-text-light);
      line-height: 1.6;
    }

    .member-benefits {
      padding: var(--space-5xl) 0;
      background-color: var(--color-cream);
    }

    .benefits-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-lg);
    }

    .benefit-card {
      text-align: center;
      padding: var(--space-2xl) var(--space-lg);
      background-color: var(--color-white);
      border-radius: var(--radius-md);
      transition: all var(--transition-base);
    }

    .benefit-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .benefit-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--color-cream);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-lg);
      color: var(--color-brown);
    }

    .benefit-card h3 {
      font-family: var(--font-serif-cn);
      font-size: 1.125rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--color-brown);
      margin-bottom: var(--space-sm);
    }

    .benefit-card p {
      font-size: 0.875rem;
      color: var(--color-text-light);
      line-height: 1.6;
    }

    .success-box {
      text-align: center;
      padding: var(--space-3xl);
      background-color: var(--color-cream);
      border-radius: var(--radius-md);
    }

    .success-box svg {
      color: var(--color-gold);
      margin-bottom: var(--space-lg);
    }

    .success-box h3 {
      font-family: var(--font-serif-cn);
      font-size: 1.5rem;
      color: var(--color-brown);
      margin-bottom: var(--space-md);
    }

    .success-box p {
      color: var(--color-text-light);
      margin-bottom: var(--space-xl);
    }

    .forgot-password-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .forgot-password-modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--color-white);
      padding: var(--space-3xl);
      border-radius: var(--radius-md);
      max-width: 480px;
      width: 90%;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: var(--space-md);
      right: var(--space-md);
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--color-text-muted);
    }

    .modal-content h3 {
      font-family: var(--font-serif-cn);
      font-size: 1.25rem;
      color: var(--color-brown);
      margin-bottom: var(--space-md);
    }

    .modal-content p {
      font-size: 0.875rem;
      color: var(--color-text-light);
      margin-bottom: var(--space-xl);
    }

    @media (max-width: 1024px) {
      .benefits-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .member-hero {
        padding: calc(var(--header-height) + var(--space-3xl)) 0 var(--space-3xl);
      }

      .member-auth,
      .member-benefits {
        padding: var(--space-4xl) 0;
      }

      .auth-tabs {
        gap: var(--space-md);
      }

      .form-row {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-md);
      }

      .benefits-grid {
        grid-template-columns: 1fr;
        gap: var(--space-md);
      }

      .benefit-card {
        display: flex;
        align-items: center;
        gap: var(--space-lg);
        text-align: left;
        padding: var(--space-lg);
      }

      .benefit-icon {
        margin-bottom: 0;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <div id="template-header"></div>

  <main>
    <section class="member-hero">
      <div class="container">
        <div class="member-hero-content">
          <h1 class="member-hero-title">會員中心</h1>
          <p class="member-hero-subtitle">Member</p>
          <p class="member-hero-desc">加入會員，掌握新品、季節系列與活動資訊。</p>
        </div>
      </div>
    </section>

    <section class="member-auth" id="auth">
      <div class="container">
        <div class="auth-container">
          <div class="auth-tabs">
            <button class="tab-btn active" data-tab="login">登入</button>
            <button class="tab-btn" data-tab="register">註冊</button>
          </div>

          <div class="tab-panel active" id="panel-login">
            <form class="auth-form active" id="loginForm" novalidate>
              <div class="form-group">
                <label for="login-email">電子郵件 <span class="required">*</span></label>
                <input type="email" id="login-email" name="email" placeholder="請輸入電子郵件" required>
                <span class="form-error" id="login-email-error">請輸入有效的電子郵件</span>
              </div>
              <div class="form-group">
                <label for="login-password">密碼 <span class="required">*</span></label>
                <input type="password" id="login-password" name="password" placeholder="請輸入密碼" required>
                <span class="form-error" id="login-password-error">請輸入密碼</span>
              </div>
              <div class="form-row">
                <label class="form-checkbox">
                  <input type="checkbox" name="remember">
                  <span>記住我</span>
                </label>
                <a href="javascript:void(0)" class="form-link" id="forgotPasswordLink">忘記密碼?</a>
              </div>
              <button type="submit" class="btn btn-primary">登入</button>
            </form>
          </div>

          <div class="tab-panel" id="panel-register">
            <form class="auth-form" id="registerForm" novalidate>
              <div class="form-group">
                <label for="register-name">姓名 <span class="required">*</span></label>
                <input type="text" id="register-name" name="name" placeholder="請輸入姓名" required>
                <span class="form-error" id="register-name-error">請輸入姓名</span>
              </div>
              <div class="form-group">
                <label for="register-email">電子郵件 <span class="required">*</span></label>
                <input type="email" id="register-email" name="email" placeholder="請輸入電子郵件" required>
                <span class="form-error" id="register-email-error">請輸入有效的電子郵件</span>
              </div>
              <div class="form-group">
                <label for="register-password">密碼 <span class="required">*</span></label>
                <input type="password" id="register-password" name="password" placeholder="請輸入密碼（至少6位）" required>
                <span class="form-error" id="register-password-error">密碼至少需要6個字元</span>
              </div>
              <div class="form-group">
                <label for="register-confirm">確認密碼 <span class="required">*</span></label>
                <input type="password" id="register-confirm" name="confirm" placeholder="請再次輸入密碼" required>
                <span class="form-error" id="confirm-error">兩次輸入的密碼不一致</span>
              </div>
              <label class="form-terms">
                <input type="checkbox" name="terms" required>
                <span>我已閱讀並同意<a href="#" class="form-link">服務條款</a>與<a href="#" class="form-link">隱私權政策</a></span>
              </label>
              <button type="submit" class="btn btn-primary">註冊</button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="member-benefits" id="benefits">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title">加入會員的好處</h2>
          <p class="section-subtitle">Member Benefits</p>
        </div>
        <div class="benefits-grid">
          <div class="benefit-card">
            <div class="benefit-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>
            <h3>生日優惠</h3>
            <p>生日月份享專屬折扣</p>
          </div>
          <div class="benefit-card">
            <div class="benefit-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <h3>新品搶先看</h3>
            <p>第一時間獲得新品資訊</p>
          </div>
          <div class="benefit-card">
            <div class="benefit-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <h3>會員專屬活動</h3>
            <p>參與品牌限時活動</p>
          </div>
          <div class="benefit-card">
            <div class="benefit-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
            </div>
            <h3>積點回饋</h3>
            <p>消費累積點數兌換好禮</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="template-footer"></div>

  <div class="forgot-password-modal" id="forgotPasswordModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <h3>重設密碼</h3>
      <p>請輸入您的註冊電子郵件，我們將發送密碼重設連結。</p>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label for="forgot-email">電子郵件 <span class="required">*</span></label>
          <input type="email" id="forgot-email" name="email" placeholder="請輸入註冊電子郵件" required>
          <span class="form-error" id="forgot-email-error">請輸入有效的電子郵件</span>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">發送重設連結</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/icons.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/main.js"></script>
  <script src="js/member.js"></script>
  <script>
    TSUMUGI.Templates.init('member.html');
  </script>
</body>
</html>
