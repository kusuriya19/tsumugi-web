<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="紬 TSUMUGI — 聯絡我們。有任何問題或建議，歡迎與我們聯繫。">
  <meta property="og:title" content="聯絡我們｜紬 TSUMUGI">
  <meta property="og:description" content="有任何問題或建議，歡迎與我們聯繫。">
  <meta property="og:image" content="asset/og-image.svg">
  <meta property="og:type" content="website">
  <title>聯絡我們｜紬 TSUMUGI</title>
  <link rel="icon" type="image/svg+xml" href="asset/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="template-header"></div>

  <main>
    <!-- Page Hero -->
    <section class="about-hero">
      <div class="container">
        <div class="about-hero-content">
          <h1 class="about-hero-title">聯絡我們</h1>
          <p class="about-hero-subtitle">Contact</p>
          <p class="about-hero-desc">有任何問題或建議，歡迎與我們聯繫。</p>
        </div>
      </div>
    </section>

    <!-- Contact Grid -->
    <section class="contact-grid-section">
      <div class="container">
        <div class="contact-grid">
          <!-- Contact Form -->
          <div class="contact-form-wrap fade-in">
            <h2 class="section-title">寫信給我們</h2>
            <p class="section-subtitle">Send a Message</p>
            <form class="contact-form" id="contactForm">
              <div class="form-group">
                <label for="contact-name">姓名 <span class="required">*</span></label>
                <input type="text" id="contact-name" name="name" required placeholder="您的姓名">
              </div>
              <div class="form-group">
                <label for="contact-email">電子信箱 <span class="required">*</span></label>
                <input type="email" id="contact-email" name="email" required placeholder="example@mail.com">
              </div>
              <div class="form-group">
                <label for="contact-phone">電話 <span class="required">*</span></label>
                <input type="tel" id="contact-phone" name="phone" required placeholder="0912-345-678" maxlength="12">
              </div>
              <div class="form-group">
                <label for="contact-subject">主題</label>
                <select id="contact-subject" name="subject">
                  <option value="" disabled selected>請選擇諮詢主題</option>
                  <option value="product">商品諮詢</option>
                  <option value="order">訂單查詢</option>
                  <option value="custom">客製服務</option>
                  <option value="collab">合作洽詢</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div class="form-group">
                <label for="contact-message">內容 <span class="required">*</span></label>
                <textarea id="contact-message" name="message" rows="6" required placeholder="請描述您的問題或需求..."></textarea>
              </div>
              <div id="form-status" class="form-status" style="display:none;"></div>
              <button type="submit" class="btn btn-primary">送出訊息</button>
            </form>
          </div>

          <!-- Contact Info -->
          <div class="contact-info-wrap fade-in">
            <h2 class="section-title">聯繫方式</h2>
            <p class="section-subtitle">Get in Touch</p>
            <div class="contact-cards">
              <div class="contact-card">
                <div class="contact-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div class="contact-card-content">
                  <h3>聯絡電話</h3>
                  <p><a href="tel:+886212345678">02-1234-5678</a></p>
                </div>
              </div>
              <div class="contact-card">
                <div class="contact-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </div>
                <div class="contact-card-content">
                  <h3>電子信箱</h3>
                  <p><a href="mailto:hello@tsumugi.com">hello@tsumugi.com</a></p>
                </div>
              </div>
              <div class="contact-card">
                <div class="contact-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                </div>
                <div class="contact-card-content">
                  <h3>LINE</h3>
                  <p><a href="#">@tsumugi</a></p>
                </div>
              </div>
              <div class="contact-card">
                <div class="contact-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                </div>
                <div class="contact-card-content">
                  <h3>Instagram</h3>
                  <p><a href="#">@tsumugi_official</a></p>
                </div>
              </div>
              <div class="contact-card">
                <div class="contact-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <div class="contact-card-content">
                  <h3>回復工作日</h3>
                  <p>我們將於 <strong>2 個工作天</strong>內回覆。<br>服務時間：週一至週五 10:00–18:00</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Map Placeholder -->
    <section class="map-section">
      <div class="container">
        <div class="map-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--color-brown-light)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <p>地圖位置</p>
        </div>
      </div>
    </section>

    <!-- Social Links -->
    <section class="contact-social-section">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title">追蹤我們</h2>
          <p class="section-subtitle">Follow Us</p>
        </div>
        <div class="social-links">
          <a href="#" class="social-link" aria-label="Instagram">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            <span>Instagram</span>
          </a>
          <a href="#" class="social-link" aria-label="LINE">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>LINE</span>
          </a>
          <a href="#" class="social-link" aria-label="Facebook">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            <span>Facebook</span>
          </a>
          <a href="#" class="social-link" aria-label="YouTube">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
            <span>YouTube</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="template-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/icons.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
  <script>
    TSUMUGI.Templates.init('contact.html');

    var phoneInput = document.getElementById('contact-phone');
    if (phoneInput) {
      phoneInput.addEventListener('input', function() {
        var val = this.value.replace(/[^0-9\-]/g, '');
        if (val.length > 12) val = val.substring(0, 12);
        this.value = val;
      });
      phoneInput.addEventListener('keypress', function(e) {
        var char = String.fromCharCode(e.which);
        if (!/[0-9\-]/.test(char)) {
          e.preventDefault();
        }
      });
    }
  </script>
</body>
</html>
